ourStory:
  sectionLabel: "OUR STORY"
  heading: "True North Property Group"
  subheading: "Serving Virginia, Maryland, and Washington D.C."
  paragraphs:
    - "True North Property Group (TNPG) was founded by Tony and Brandon, a father-son real estate team whose business is guided by their \"True North\", a constant moral compass rooted in integrity, intrinsic motivation, and service to their clients and community."
    - "Our team is committed to making a difference, not only in the real estate journeys of our clients, but also in the communities we serve. At True North Property Group, our mission is simple: to deliver positive results with honesty, dedication, and heart."
services:
  sectionLabel: "OUR SERVICES"
  heading: "Finding Your Perfect Match"
  subheading: "Whether you're buying your dream home or selling your property, we're here to guide you every step of the way."
  buyers:
    title: "For Buyers"
    description: "Finding your perfect home is a journey, and we're here to make it smooth and enjoyable. Our buyer services include personalized property searches, neighborhood insights, and guidance through every step of the closing process."
    features:
      - "Personalized property searches"
      - "Expert negotiation"
      - "First-time buyer guidance"
  sellers:
    title: "For Sellers"
    description: "Selling your home should be a rewarding experience. We provide comprehensive marketing strategies, professional staging advice, and skilled negotiation to ensure you get the best possible value for your property."
    features:
      - "Strategic pricing"
      - "Professional photography"
      - "Targeted marketing"
