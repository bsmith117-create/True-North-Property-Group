header:
  title: "Buy a Home in"
  titleHighlight: "VA/DC/MD"
  subtitle: "Your journey to homeownership starts here. Let us guide you every step of the way."
about:
  sectionLabel: "Our Commitment to Buyers"
  heading: "Dedicated Service, Unmatched Expertise"
  content: "Buying a home is a significant milestone. At True North Property Group, we provide comprehensive services designed to make your home buying process as smooth and successful as possible. From initial consultation to closing day, we are your trusted advisors and advocates."
journey:
  sectionLabel: "Your Path to Ownership"
  heading: "The Homebuying Journey"
  subheading: "We guide you through every step of the process"
  phases:
    - title: "Phase 1: Preparation"
      steps:
        - "Check and strengthen your credit (640+ is ideal)."
        - "Gather financial documents (pay stubs, tax returns, bank statements)."
        - "Explore loan programs (FHA, VA, USDA, Conventional, First-Time Buyer programs)."
        - "Budget for upfront costs: earnest money, inspections, and closing costs."
    - title: "Phase 2: Getting Started"
      steps:
        - "Choose your dedicated True North buyer's agent."
        - "Get pre-approved with a trusted lender."
        - "Begin your home search with tailored listings."
    - title: "Phase 3: Making an Offer"
      steps:
        - "Submit your offer with pre-approval."
        - "Contract ratification."
        - "Provide earnest money deposit (typically 1–2%)."
        - "Coordinate with the title company and lender."
    - title: "Phase 4: Inspections & Approvals"
      steps:
        - "Schedule home, termite, and various other inspections."
        - "Review HOA or condo documents (if applicable)."
        - "Appraisal and full loan approval process begins."
    - title: "Phase 5: Closing"
      steps:
        - "Complete final walkthrough."
        - "Wire closing funds."
        - "Sign documents and get your keys!"
  importantNote: "Avoid big purchases or job changes during this time to protect your approval."
partner:
  sectionLabel: "Your Partner in Success"
  heading: "Why Work With True North"
  services:
    - title: "Exclusive Access"
      description: "Get access to on- and off-market properties that match your criteria, giving you a competitive edge."
    - title: "Expert Negotiation"
      description: "Our agents are skilled negotiators who work to get you the best price and terms possible."
    - title: "Seamless Process"
      description: "We handle the complexities, from paperwork to inspections, ensuring a stress-free experience."
    - title: "Local Knowledge"
      description: "Leverage our deep understanding of local markets in VA, MD, and DC to find the perfect community for you."
pricing:
